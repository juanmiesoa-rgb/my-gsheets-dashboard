<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Overview</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 950: '#020617' } } } }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // --- SVG Icons ---
        const Icon = ({ path, className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={path} /></svg>
        );
        const Icons = {
            Plus: <Icon path="M5 12h14M12 5v14" />,
            Search: <Icon path="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />,
            Moon: <Icon path="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
            Sun: <Icon path="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />,
            ArrowUpRight: <Icon path="M7 17L17 7M7 7h10v10" className="w-4 h-4" />,
            ArrowDownRight: <Icon path="M7 7l10 10M17 7v10H7" className="w-4 h-4" />,
            AlertCircle: <Icon path="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 8v4M12 16h.01" className="w-4 h-4" />,
            CheckCircle2: <Icon path="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM9 12l2 2 4-4" className="w-4 h-4" />,
            Clock: <Icon path="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 6v6l4 2" />,
            TrendingUp: <Icon path="M23 6l-9.5 9.5-5-5L1 18M17 6h6v6" className="w-4 h-4" />,
            Wallet: <Icon path="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4Z" className="w-4 h-4" />,
            Calendar: <Icon path="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />,
            X: <Icon path="M18 6L6 18M6 6l12 12" className="w-5 h-5" />,
            Edit2: <Icon path="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" className="w-4 h-4" />,
            Trash2: <Icon path="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" className="w-4 h-4" />,
            Save: <Icon path="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8" className="w-4 h-4" />,
            RefreshCw: <Icon path="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" className="w-8 h-8" />
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyb8RAOBtEI1wX9Xo3rqxqks2tqMj5ROpJ0FHDZBu6Gqi1SWbuwGoVjeuCni_vribvwvg/exec";

        const SAMPLE_DATA = [
          { id: "rec_1", date: "2026-08-01", category: "Management", grouping: "Monthly Budget", description: "August", amount: 3.04, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_2", date: "2026-08-01", category: "Travel", grouping: "Mami Marisol", description: "Iryo", amount: -44.58, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_3", date: "2026-08-01", category: "Personal", grouping: "Ale", description: "Money pending", amount: -84.69, type: "Adjustment", status: "Closed", closingDate: "" },
          { id: "rec_4", date: "2026-08-01", category: "Travel", grouping: "Summer Holidays", description: "Hotels", amount: -586.50, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_5", date: "2026-08-02", category: "Travel", grouping: "Mami Marisol", description: "Iryo", amount: -88.97, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_6", date: "2026-08-02", category: "Celebrations", grouping: "Mami Arrival Dinner", description: "Dinner", amount: -111.36, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_7", date: "2026-08-03", category: "Finance", grouping: "Investments", description: "Fees", amount: -50.00, type: "Adjustment", status: "Closed", closingDate: "" },
          { id: "rec_8", date: "2026-08-04", category: "Personal", grouping: "Juanmi", description: "Personal adjustment", amount: 24.17, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_9", date: "2026-08-08", category: "Travel", grouping: "Summer Holidays", description: "Travel expenses", amount: -379.21, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_10", date: "2026-08-12", category: "Celebrations", grouping: "Juanmi's Birthday", description: "PortAventura", amount: -274.50, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_11", date: "2026-08-18", category: "Travel", grouping: "Northern Spain", description: "Trip", amount: -638.82, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_12", date: "2026-08-19", category: "Travel", grouping: "El Salvador", description: "Nena flight taxes", amount: -26.72, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_13", date: "2026-08-19", category: "Celebrations", grouping: "Juanmi's Birthday", description: "César and Marco", amount: 325.64, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_14", date: "2026-08-22", category: "Travel", grouping: "Benidorm and Fau", description: "Trip", amount: -408.52, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_15", date: "2026-08-22", category: "Personal", grouping: "Juanmi", description: "Personal purchase", amount: -42.93, type: "Adjustment", status: "Closed", closingDate: "" },
          { id: "rec_16", date: "2026-08-27", category: "Work / Benefits", grouping: "CCOO", description: "CCOO", amount: -15.70, type: "Adjustment", status: "Closed", closingDate: "" },
          { id: "rec_17", date: "2026-08-27", category: "Celebrations", grouping: "Laura's Gift", description: "Gift", amount: -29.99, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_18", date: "2026-08-30", category: "Travel", grouping: "El Salvador", description: "Return flight taxes", amount: -128.63, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_19", date: "2026-08-30", category: "Travel", grouping: "El Salvador", description: "Chencho September", amount: -375.00, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_20", date: "2026-08-31", category: "Personal", grouping: "Mimi", description: "August", amount: 45.00, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_21", date: "2026-09-02", category: "Finance", grouping: "Saving Plan", description: "Fees", amount: -50.00, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_22", date: "2026-09-02", category: "Work / Benefits", grouping: "Valencia Shopping Bonus", description: "Shopping bonus", amount: -50.00, type: "Adjustment", status: "Pending", closingDate: "" },
          { id: "rec_23", date: "2026-09-02", category: "Personal", grouping: "Juanmi", description: "Fuel", amount: -99.85, type: "Adjustment", status: "Closed", closingDate: "" },
          { id: "rec_24", date: "2026-09-03", category: "Management", grouping: "Monthly Budget", description: "September", amount: 803.08, type: "Movement", status: "Closed", closingDate: "" },
          { id: "rec_25", date: "2026-09-08", category: "Celebrations", grouping: "Birthday Weekend", description: "Week 1", amount: 0.00, type: "Movement", status: "Closed", closingDate: "" }
        ];

        const CATEGORIES = ["Travel", "Home", "Celebrations", "Finance", "Personal", "Management", "Work / Benefits"];
        const COLORS = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f59e0b', '#10b981', '#3b82f6'];

        const formatCurrency = (amount) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(amount);
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [transactions, setTransactions] = useState(SAMPLE_DATA);
            const [currentBalance, setCurrentBalance] = useState(5000.00);
            const [isLoading, setIsLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [filterType, setFilterType] = useState("All");
            const [filterStatus, setFilterStatus] = useState("All");
            const [groupingSort, setGroupingSort] = useState("highest_spending");

            useEffect(() => {
                fetch(GAS_URL).then(res => res.json()).then(data => {
                    if (data && Array.isArray(data) && data.length > 0) {
                        setTransactions(data);
                        showToast("Data synced from Google Sheets", "success");
                    }
                }).catch(() => {
                    showToast("Running in offline mode with sample data", "warning");
                }).finally(() => setIsLoading(false));
            }, []);

            useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            const showToast = (msg, type) => setToast({ msg, type });

            const pendingAdjustments = useMemo(() => transactions.filter(t => t.type === 'Adjustment' && t.status === 'Pending'), [transactions]);
            const expectedToReturn = useMemo(() => Math.abs(pendingAdjustments.filter(t => t.amount < 0).reduce((sum, t) => sum + t.amount, 0)), [pendingAdjustments]);
            const expectedToLeave = useMemo(() => pendingAdjustments.filter(t => t.amount > 0).reduce((sum, t) => sum + t.amount, 0), [pendingAdjustments]);
            const realBalance = useMemo(() => currentBalance - pendingAdjustments.reduce((sum, t) => sum + t.amount, 0), [currentBalance, pendingAdjustments]);

            const groupings = useMemo(() => {
                const groups = {};
                transactions.forEach(t => {
                    if (!groups[t.grouping]) groups[t.grouping] = { name: t.grouping, total: 0, count: 0, pending: 0, latestDate: t.date };
                    groups[t.grouping].total += t.amount;
                    groups[t.grouping].count += 1;
                    if (t.type === 'Adjustment' && t.status === 'Pending') groups[t.grouping].pending += t.amount;
                    if (t.date > groups[t.grouping].latestDate) groups[t.grouping].latestDate = t.date;
                });
                return Object.values(groups);
            }, [transactions]);

            const sortedGroupings = useMemo(() => {
                let sorted = [...groupings];
                if (groupingSort === 'highest_spending') sorted.sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
                if (groupingSort === 'largest_pending') sorted.sort((a, b) => Math.abs(b.pending) - Math.abs(a.pending));
                if (groupingSort === 'most_recent') sorted.sort((a, b) => b.latestDate.localeCompare(a.latestDate));
                if (groupingSort === 'most_transactions') sorted.sort((a, b) => b.count - a.count);
                return sorted;
            }, [groupings, groupingSort]);

            const categoryData = useMemo(() => {
                const cats = {};
                transactions.forEach(t => {
                    if (!cats[t.category]) cats[t.category] = 0;
                    cats[t.category] += Math.abs(t.amount);
                });
                return Object.entries(cats).map(([name, value], i) => ({ name, value, color: COLORS[i % COLORS.length] }));
            }, [transactions]);

            const activityData = useMemo(() => {
                const months = {};
                transactions.forEach(t => {
                    const month = t.date.substring(0, 7);
                    if (!months[month]) months[month] = { month, inflows: 0, outflows: 0, net: 0 };
                    if (t.amount > 0) months[month].inflows += t.amount;
                    else months[month].outflows += Math.abs(t.amount);
                });
                Object.keys(months).forEach(m => { months[m].net = months[m].inflows - months[m].outflows; });
                return Object.values(months).sort((a, b) => a.month.localeCompare(b.month));
            }, [transactions]);

            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const matchesSearch = t.description.toLowerCase().includes(searchQuery.toLowerCase()) || t.grouping.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesType = filterType === "All" || t.type === filterType;
                    const matchesStatus = filterStatus === "All" || t.status === filterStatus;
                    return matchesSearch && matchesType && matchesStatus;
                }).sort((a, b) => b.date.localeCompare(a.date));
            }, [transactions, searchQuery, filterType, filterStatus]);

            const handleSaveTransaction = (tx) => {
                const isNew = !tx.id;
                const newTx = isNew ? { ...tx, id: `rec_${Date.now()}` } : tx;
                setTransactions(prev => isNew ? [...prev, newTx] : prev.map(t => t.id === tx.id ? newTx : t));
                setIsModalOpen(false);
                setEditingTx(null);
                showToast(isNew ? "Transaction added" : "Transaction updated", "success");
            };

            const handleDeleteTransaction = (id) => {
                if (!confirm("Are you sure you want to delete this record?")) return;
                setTransactions(prev => prev.filter(t => t.id !== id));
                showToast("Transaction deleted", "warning");
            };

            const handleQuickClose = (id) => {
                const tx = transactions.find(t => t.id === id);
                if (!tx) return;
                const updatedTx = { ...tx, status: 'Closed', closingDate: new Date().toISOString().split('T')[0] };
                setTransactions(prev => prev.map(t => t.id === id ? updatedTx : t));
                showToast("Adjustment marked as Closed", "success");
            };

            if (isLoading) return <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center"><div className="animate-spin text-indigo-600">{Icons.RefreshCw}</div></div>;

            return (
                <div className={darkMode ? 'dark' : ''}>
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 transition-colors duration-300">
                        {toast && (
                            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 animate-in ${toast.type === 'success' ? 'bg-emerald-600 text-white' : toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-white'}`}>
                                {toast.type === 'success' ? Icons.CheckCircle2 : Icons.AlertCircle}
                                <span className="text-sm font-medium">{toast.msg}</span>
                            </div>
                        )}

                        <header className="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-slate-900 dark:text-white">TRADE OVERVIEW</h1>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Personal Financial Management</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                        {darkMode ? Icons.Sun : Icons.Moon}
                                    </button>
                                    <button onClick={() => { setEditingTx(null); setIsModalOpen(true); }} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                                        {Icons.Plus} Add Transaction
                                    </button>
                                </div>
                            </div>
                        </header>

                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                            {/* Financial Overview */}
                            <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="col-span-1 md:col-span-2 lg:col-span-2 bg-gradient-to-br from-indigo-600 to-indigo-800 text-white rounded-2xl p-6 shadow-lg relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-32 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16"></div>
                                    <div className="relative z-10">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-indigo-100 font-medium flex items-center gap-2">{Icons.Wallet} Real Balance</span>
                                            <span className="text-xs bg-white/20 px-2 py-1 rounded-full">True Financial Position</span>
                                        </div>
                                        <div className="text-4xl sm:text-5xl font-bold tracking-tight mb-2">{formatCurrency(realBalance)}</div>
                                        <div className="text-sm text-indigo-200 flex items-center gap-2">
                                            <span>Current TR: {formatCurrency(currentBalance)}</span>
                                            <span className="w-1 h-1 bg-indigo-300 rounded-full"></span>
                                            <span>{pendingAdjustments.length} pending adjustments</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                    <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400 mb-2">{Icons.TrendingUp}<span className="text-sm font-medium">Current TR Balance</span></div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl font-bold text-slate-900 dark:text-white">€</span>
                                        <input type="number" value={currentBalance} onChange={(e) => setCurrentBalance(parseFloat(e.target.value) || 0)} className="text-2xl font-bold bg-transparent border-b border-slate-300 dark:border-slate-700 focus:border-indigo-500 outline-none w-full text-slate-900 dark:text-white" step="0.01" />
                                    </div>
                                    <p className="text-xs text-slate-400 mt-2">Manually enter your Trade Republic balance</p>
                                </div>

                                <div className="space-y-4">
                                    <div className="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 rounded-2xl p-4">
                                        <div className="flex items-center justify-between mb-1">
                                            <span className="text-emerald-700 dark:text-emerald-400 text-sm font-medium flex items-center gap-1">{Icons.ArrowDownRight} Expected to Return</span>
                                        </div>
                                        <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-400">{formatCurrency(expectedToReturn)}</div>
                                        <p className="text-xs text-emerald-600/70 dark:text-emerald-500/70 mt-1">Money owed back to you</p>
                                    </div>
                                    <div className="bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 rounded-2xl p-4">
                                        <div className="flex items-center justify-between mb-1">
                                            <span className="text-rose-700 dark:text-rose-400 text-sm font-medium flex items-center gap-1">{Icons.ArrowUpRight} Expected to Leave</span>
                                        </div>
                                        <div className="text-2xl font-bold text-rose-700 dark:text-rose-400">{formatCurrency(expectedToLeave)}</div>
                                        <p className="text-xs text-rose-600/70 dark:text-rose-500/70 mt-1">Money that will be deducted</p>
                                    </div>
                                </div>
                            </section>

                            {/* Pending Adjustments */}
                            {pendingAdjustments.length > 0 && (
                                <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
                                    <div className="p-6 border-b border-slate-200 dark:border-slate-800">
                                        <h2 className="text-lg font-bold flex items-center gap-2">{Icons.Clock} Pending Adjustments</h2>
                                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1"> Negative = Money returning to you. Positive = Money leaving your account.</p>
                                    </div>
                                    <div className="divide-y divide-slate-200 dark:divide-slate-800">
                                        {pendingAdjustments.sort((a,b) => b.date.localeCompare(a.date)).map(tx => (
                                            <div key={tx.id} className="p-4 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-2 h-12 rounded-full ${tx.amount < 0 ? 'bg-emerald-500' : 'bg-rose-500'}`}></div>
                                                    <div>
                                                        <div className="font-semibold text-slate-900 dark:text-white">{tx.grouping}</div>
                                                        <div className="text-sm text-slate-500 dark:text-slate-400">{tx.description} • {formatDate(tx.date)}</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <div className={`text-right ${tx.amount < 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                                                        <div className="font-bold text-lg">{formatCurrency(tx.amount)}</div>
                                                        <div className="text-xs font-medium uppercase tracking-wider">{tx.amount < 0 ? 'Returning' : 'Leaving'}</div>
                                                    </div>
                                                    <button onClick={() => handleQuickClose(tx.id)} className="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 rounded-lg transition-colors" title="Mark as Closed">
                                                        {Icons.CheckCircle2}
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* Projects & Groupings */}
                            <section>
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-bold flex items-center gap-2">{Icons.Calendar} Projects & Groupings</h2>
                                    <select value={groupingSort} onChange={(e) => setGroupingSort(e.target.value)} className="text-sm border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                                        <option value="highest_spending">Highest Spending</option>
                                        <option value="largest_pending">Largest Pending</option>
                                        <option value="most_recent">Most Recent</option>
                                        <option value="most_transactions">Most Transactions</option>
                                    </select>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {sortedGroupings.slice(0, 6).map((g) => (
                                        <div key={g.name} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="font-bold text-slate-900 dark:text-white truncate pr-2">{g.name}</h3>
                                                {g.pending !== 0 && (
                                                    <span className={`text-xs font-bold px-2 py-1 rounded-full ${g.pending < 0 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-400'}`}>
                                                        {g.pending < 0 ? '+' : '-'}{formatCurrency(Math.abs(g.pending))} pending
                                                    </span>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-sm">
                                                    <span className="text-slate-500 dark:text-slate-400">Total Impact</span>
                                                    <span className={`font-semibold ${g.total >= 0 ? 'text-emerald-600' : 'text-slate-900 dark:text-white'}`}>{formatCurrency(g.total)}</span>
                                                </div>
                                                <div className="flex justify-between text-sm">
                                                    <span className="text-slate-500 dark:text-slate-400">Transactions</span>
                                                    <span className="font-medium">{g.count}</span>
                                                </div>
                                                <div className="flex justify-between text-sm">
                                                    <span className="text-slate-500 dark:text-slate-400">Latest Activity</span>
                                                    <span className="font-medium">{formatDate(g.latestDate)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* Analytics Row */}
                            <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                    <h3 className="text-lg font-bold mb-4">Category Analysis</h3>
                                    <div className="h-64">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={categoryData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                                    {categoryData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.color} />))}
                                                </Pie>
                                                <Tooltip formatter={(value) => formatCurrency(value)} />
                                                <Legend verticalAlign="bottom" height={36} iconType="circle" />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                    <h3 className="text-lg font-bold mb-4">Financial Activity Over Time</h3>
                                    <div className="h-64">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={activityData}>
                                                <defs>
                                                    <linearGradient id="colorIn" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#10b981" stopOpacity={0.3}/><stop offset="95%" stopColor="#10b981" stopOpacity={0}/></linearGradient>
                                                    <linearGradient id="colorOut" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#f43f5e" stopOpacity={0.3}/><stop offset="95%" stopColor="#f43f5e" stopOpacity={0}/></linearGradient>
                                                </defs>
                                                <CartesianGrid strokeDasharray="3 3" stroke={darkMode ? '#334155' : '#e2e8f0'} />
                                                <XAxis dataKey="month" stroke={darkMode ? '#94a3b8' : '#64748b'} fontSize={12} />
                                                <YAxis stroke={darkMode ? '#94a3b8' : '#64748b'} fontSize={12} tickFormatter={(val) => `€${val}`} />
                                                <Tooltip formatter={(value) => formatCurrency(value)} />
                                                <Legend />
                                                <Area type="monotone" dataKey="inflows" name="Inflows" stroke="#10b981" fillOpacity={1} fill="url(#colorIn)" />
                                                <Area type="monotone" dataKey="outflows" name="Outflows" stroke="#f43f5e" fillOpacity={1} fill="url(#colorOut)" />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </section>

                            {/* Transaction History */}
                            <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
                                <div className="p-6 border-b border-slate-200 dark:border-slate-800 space-y-4">
                                    <h2 className="text-lg font-bold">Transaction History</h2>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <div className="relative flex-1">
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{Icons.Search}</div>
                                            <input type="text" placeholder="Search description or grouping..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                        </div>
                                        <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                            <option value="All">All Types</option>
                                            <option value="Movement">Movement</option>
                                            <option value="Adjustment">Adjustment</option>
                                        </select>
                                        <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                            <option value="All">All Statuses</option>
                                            <option value="Pending">Pending</option>
                                            <option value="Closed">Closed</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 font-medium">
                                            <tr>
                                                <th className="px-6 py-3">Date</th>
                                                <th className="px-6 py-3">Category</th>
                                                <th className="px-6 py-3">Grouping</th>
                                                <th className="px-6 py-3">Description</th>
                                                <th className="px-6 py-3 text-right">Amount</th>
                                                <th className="px-6 py-3">Type</th>
                                                <th className="px-6 py-3">Status</th>
                                                <th className="px-6 py-3 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                                            {filteredTransactions.map(tx => (
                                                <tr key={tx.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap text-slate-600 dark:text-slate-300">{formatDate(tx.date)}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap"><span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200">{tx.category}</span></td>
                                                    <td className="px-6 py-4 font-medium text-slate-900 dark:text-white">{tx.grouping}</td>
                                                    <td className="px-6 py-4 text-slate-600 dark:text-slate-300">{tx.description}</td>
                                                    <td className={`px-6 py-4 text-right font-semibold ${tx.amount >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>{formatCurrency(tx.amount)}</td>
                                                    <td className="px-6 py-4"><span className={`inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-medium ${tx.type === 'Movement' ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300' : 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'}`}>{tx.type === 'Movement' ? Icons.CheckCircle2 : Icons.AlertCircle}{tx.type}</span></td>
                                                    <td className="px-6 py-4"><span className={`inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-medium ${tx.status === 'Pending' ? 'bg-rose-50 text-rose-700 dark:bg-rose-900/30 dark:text-rose-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'}`}>{tx.status}{tx.status === 'Closed' && tx.closingDate && ` (${formatDate(tx.closingDate)})`}</span></td>
                                                    <td className="px-6 py-4 text-right">
                                                        <div className="flex items-center justify-end gap-2">
                                                            {tx.type === 'Adjustment' && tx.status === 'Pending' && (<button onClick={() => handleQuickClose(tx.id)} className="p-1.5 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 rounded" title="Mark Closed">{Icons.CheckCircle2}</button>)}
                                                            <button onClick={() => { setEditingTx(tx); setIsModalOpen(true); }} className="p-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded" title="Edit">{Icons.Edit2}</button>
                                                            <button onClick={() => handleDeleteTransaction(tx.id)} className="p-1.5 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded" title="Delete">{Icons.Trash2}</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {filteredTransactions.length === 0 && (<div className="p-12 text-center text-slate-500 dark:text-slate-400">No transactions found matching your filters.</div>)}
                                </div>
                            </section>
                        </main>

                        {/* Transaction Modal */}
                        {isModalOpen && (
                            <TransactionModal transaction={editingTx} onClose={() => { setIsModalOpen(false); setEditingTx(null); }} onSave={handleSaveTransaction} />
                        )}
                    </div>
                </div>
            );
        }

        function TransactionModal({ transaction, onClose, onSave }) {
            const [formData, setFormData] = useState({
                id: transaction?.id || "",
                date: transaction?.date || new Date().toISOString().split('T')[0],
                category: transaction?.category || "Personal",
                grouping: transaction?.grouping || "",
                description: transaction?.description || "",
                amount: transaction?.amount || 0,
                type: transaction?.type || "Movement",
                status: transaction?.status || "Closed",
                closingDate: transaction?.closingDate || ""
            });

            useEffect(() => {
                if (formData.type === 'Movement') setFormData(prev => ({ ...prev, status: 'Closed' }));
            }, [formData.type]);

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 dark:border-slate-800 overflow-hidden animate-in">
                        <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <h3 className="text-lg font-bold">{transaction ? 'Edit Transaction' : 'Add New Transaction'}</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">{Icons.X}</button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Date</label>
                                    <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Type</label>
                                    <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                                        <option value="Movement">Movement</option>
                                        <option value="Adjustment">Adjustment</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Category</label>
                                <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Grouping</label>
                                <input required type="text" placeholder="e.g., El Salvador 2026, Juanmi" value={formData.grouping} onChange={e => setFormData({...formData, grouping: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Description</label>
                                <input required type="text" placeholder="e.g., Hotel, Flight taxes" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Amount (€)</label>
                                    <input required type="number" step="0.01" placeholder="0.00" value={formData.amount} onChange={e => setFormData({...formData, amount: parseFloat(e.target.value)})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                    <p className="text-xs text-slate-500 mt-1">Negative = Returning. Positive = Leaving.</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Status</label>
                                    <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} disabled={formData.type === 'Movement'} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none disabled:opacity-50">
                                        <option value="Closed">Closed</option>
                                        <option value="Pending">Pending</option>
                                    </select>
                                </div>
                            </div>
                            {formData.type === 'Adjustment' && formData.status === 'Closed' && (
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Closing Date</label>
                                    <input type="date" value={formData.closingDate} onChange={e => setFormData({...formData, closingDate: e.target.value})} className="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                </div>
                            )}
                            <div className="flex gap-3 pt-4">
                                <button type="button" onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Cancel</button>
                                <button type="submit" className="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">{Icons.Save} Save Transaction</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
